skills:
  # Every skill carries its evidence. Three states:
  #
  #   evidence: [...]   demonstrated in an entry above, or listed by Asmit on
  #                     his own resume, which is his own claim to stand behind
  #   ask: true         plausible and requested for keyword coverage, but with
  #                     nothing behind it yet. These RENDER, and every build
  #                     prints them so they are never forgotten. Confirm or cut.
  #   flag: unevidenced never rendered until someone vouches for it
  #
  # The line that matters: a keyword you cannot be interviewed on is worse than
  # a missing keyword. "Tell me how you handled state in LangGraph" ends badly
  # if the honest answer is that you have not used it.

