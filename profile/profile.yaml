# Asmit Datta - master fact base.
#
# THE RULE THAT MAKES THIS WORK: tailoring is SELECTION, never GENERATION.
# The renderer prints `text:` fields verbatim and has no free-text path. To say
# something new, a variant is added here, reviewed, and marked approved: true.
# Nothing that has not passed under human eyes can reach a PDF.
#
# Every number carries provenance. `needs_confirmation` is a hard render block:
# a figure that cannot be defended end-to-end in an interview is worse than no
# figure, because it poisons every other number on the page.
#
# approved: false everywhere below is correct and deliberate. Asmit has not read
# these yet. Read each aloud; if it does not sound like you said it, edit it.

