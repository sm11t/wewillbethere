# Phrases the system may select but must never reword. These are the details
# that only he could have written, and they are the reason a reader believes a
# person wrote this page.
protected_strings:
  - "in a day"
  - "two production dependencies"
  - "Ctrl+F-and-edit workflow"
  - "time-series deduplication"
  - "walkable computer"
  - "The human controls policy. The agent controls execution."
  - "Motivation x Ability x Timeline"
  - "App Review Guideline 2.1"

never_include:
  - {item: "Delhi Public School, R.K. Puram, 93%",
     reason: "High school does not belong on a US graduate resume."}
  - {item: "Tempe, AZ as current location", reason: "Stale. He is in New York."}
  - item: "hidden text, white font, injected prompts"
    reason: "Visible in the parsed layer, and treated as fraud when found."
  - {item: "certifications section", reason: "No target role requires one."}
  - item: "professional summary"
    reason: >-
      The current one is the most AI-flavored text on the page and repeats what
      the bullets already say. One tailored line is allowed only for HR-screened
      campus roles.
  - {item: "pronouns, photo, street address", reason: "US resume convention."}
  - {item: "references available upon request", reason: "Wastes a line. Assumed."}
