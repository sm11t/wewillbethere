# Resume variant presets.
#
# One fact base, four selections over it. These are NOT four documents to
# maintain by hand - that is how versions drift and how two applications to the
# same employer end up contradicting each other. Frozen across every preset:
# name, contact, dates, titles, institutions, and every number.
#
# The only real decision each preset makes is what goes first and what gets cut.

presets:

  bain-genai-2027:
    label: "Bain, GenAI / AI-ML Engineering Intern"
    max_pages: 1
    bullets_per_entry: 3
    one_line_skills: true
    # Projects lead. Torii and Lead Engine ARE the qualification here - agentic
    # orchestration, tool integration, guardrails and human-in-the-loop are the
    # posting's own words, and no experience entry states them as directly.
    sections: [education, projects, experience, skills]
    entries:
      experience: [myyogateacher, delhi, aisociety, watchdna, flickmatch]
      projects: [torii, lead_engine, pash, portfolio]
      leadership: []
    prefer_flavors: [infra, ml, research, teaching, backend, general]
    skill_order: ["AI & Agents", Languages, "Backend & APIs", "Data & Cloud",
                  "Frontend & Mobile"]
    # Pinecone stays - it is a vector database and it is his own claim from his
    # own resume, which is the one honest adjacency to their retrieval bullet.
    # RAG, Vector search and Embeddings are deliberately NOT promoted: they are
    # `ask: true` with nothing behind them, and this is precisely the posting
    # where putting them on the page would buy an interview that opens on
    # retrieval architecture. Ask him first.
    skill_lead: [MCP, x402, "Autonomous agents", "Tool use", "Prompt engineering",
                 "LLM streaming", "OpenAI API", "Claude API", Whisper, Pinecone,
                 LangChain, "Gaussian Processes", Python, SQL, FastAPI, REST]
    # Held off the page on purpose. The posting names all three; he has none of
    # them evidenced. Remove from this list only when he confirms he has built
    # one, and then give it an `evidence:` entry in profile.yaml.
    skill_exclude: [RAG, "Vector search", Embeddings, PyTorch, "scikit-learn"]
    notes: >-
      Strongest match on merit. Retrieval (RAG, embeddings, hybrid) is the one
      real gap - see jobs/bain-genai-ai-ml-intern.notes.md.

  stoke-boltline-2027:
    label: "Stoke Space, Software Intern Summer 2027, Boltline (full-stack TS)"
    max_pages: 1
    bullets_per_entry: 3
    one_line_skills: true
    sections: [education, experience, projects, skills]
    # Boltline is internal tooling for hardware teams - the same species as
    # WatchDNA's admin console. Full-stack TypeScript throughout, so the
    # ordering is web stack first and the AI work last, where on the McKesson
    # preset it was Python first.
    entries:
      experience: [watchdna, flickmatch, myyogateacher, aisociety, delhi]
      projects: [torii, lead_engine, pash, portfolio]
      leadership: []
    prefer_flavors: [general, frontend, backend, infra, ml, teaching]
    skill_order: [Languages, "Backend & APIs", "Frontend & Mobile",
                  "Data & Cloud", "AI & Agents"]
    # Their preferred stack, in their order, minus the two he has not used.
    # Next.js and Apollo are NOT to be added - a framework and a GraphQL client
    # he could learn in a week are not worth a false claim.
    skill_lead: [TypeScript, JavaScript, React, "Node.js", "Express.js",
                 GraphQL, PostgreSQL, AWS, Python]
    notes: >-
      EXPORT CONTROL is the real gate - see
      jobs/stoke-space-swe-intern-summer-2027.notes.md before spending effort.

