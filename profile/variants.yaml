    # bullet is entirely about.
    skill_lead: [Python, JavaScript, TypeScript, SQL, "Node.js", REST, React,
                 PostgreSQL, "Express.js", JWT, "Role-based access control",
                 SQLAlchemy, Docker, "CI/CD", Git, AWS]
    # Java is named FIRST in their responsibilities and PayPal runs Java at
