      leadership: []
    prefer_flavors: [general, backend, frontend, infra, ml, teaching]
    skill_order: [Languages, "Backend & APIs", "Frontend & Mobile",
                  "Data & Cloud", "AI & Agents"]
    # Their six named technologies first, in their order, minus Java. Then the
